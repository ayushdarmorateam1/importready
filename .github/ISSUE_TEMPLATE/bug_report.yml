name: Bug report
description: Report a reproducible CSV, CLI, or browser problem.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ImportReady. Use a small synthetic example. Public issues must not contain real customer data, personal details, or credentials. For vulnerabilities, follow SECURITY.md.
  - type: dropdown
    id: surface
    attributes:
      label: Where does the problem occur?
      options:
        - Browser app
        - Command line
        - JavaScript core
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and settings
      description: Browser or Node version, operating system, delimiter/header setting, and version or commit if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic input
      description: Include the smallest fake CSV and rules needed to reproduce the problem. For CLI issues, include the command.
      placeholder: "Describe the steps and add a small synthetic CSV."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant diagnostics or a redacted screenshot. Review reports for filenames and column names before sharing.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Sample privacy
      options:
        - label: I used synthetic or properly redacted examples and included no confidential data or credentials.
          required: true
